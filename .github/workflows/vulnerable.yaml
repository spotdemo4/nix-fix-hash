name: vulnerable

on:
  schedule:
    - cron: "0 9 * * 0" # every Sunday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actions:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@e282901cae32c9c45568095f851a7e56d0cbf46d # v1.78.0
        with:
          shell: vulnerable

      - name: Run zizmor
        run: zizmor $(find .github/workflows -name "*.yaml")

  nix:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@e282901cae32c9c45568095f851a7e56d0cbf46d # v1.78.0
        with:
          shell: vulnerable

      - name: Run flake-checker
        run: flake-checker -f

  rust:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@e282901cae32c9c45568095f851a7e56d0cbf46d # v1.78.0
        with:
          shell: vulnerable

      - name: Run cargo audit
        run: cargo-audit audit
